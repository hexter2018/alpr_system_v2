services:
  # ==================== Core Infrastructure ====================
  postgres:
    image: postgres:16
    environment:
      TZ: Asia/Bangkok
      POSTGRES_USER: alpr
      POSTGRES_PASSWORD: alpr
      POSTGRES_DB: alpr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpr -d alpr -h 127.0.0.1 -p 5432"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - alpr-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - alpr-network

  # ==================== Backend API ====================
  backend:
    build:
      context: ./backend
    user: "1000:1000"
    environment:
      TZ: Asia/Bangkok
      DATABASE_URL: postgresql+psycopg2://alpr:alpr@postgres:5432/alpr
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /storage
      CORS_ORIGINS: http://localhost:5173,http://10.32.70.136,http://10.32.70.136:5173
    volumes:
      - ./storage:/storage
      - ./models:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - alpr-network
    restart: unless-stopped
  # ==================== Celery Workers ====================
  # GPU Worker - สามารถ scale ได้ด้วย --scale worker-gpu-1=3
  worker-gpu-1:
    build:
      context: ./worker
    deploy:
      replicas: 3
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      TZ: Asia/Bangkok
      # TensorRT settings
      TRT_WORKSPACE: "4096"
      TRT_FP16: "1"
      CUDA_VISIBLE_DEVICES: "0"
      
      # Database & Redis
      DATABASE_URL: postgresql+psycopg2://alpr:alpr@postgres:5432/alpr
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /storage
      
      # Model settings
      MODEL_PATH: /models/best.pt
      DETECTOR_CONF: "0.35"
      TRT_INPUT_W: "640"
      TRT_INPUT_H: "640"
      TRT_CONF_THRES: "0.35"
      TRT_IOU_THRES: "0.45"
      TRT_CLASS_ID: "0"
      
      # ALPR settings
      MASTER_CONF_THRESHOLD: "0.95"
      
      # Celery settings (เพิ่ม concurrency สำหรับ RTSP load)
      CELERY_WORKER_CONCURRENCY: "8"
      CELERY_WORKER_PREFETCH: "16"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "200"
      
      # Performance
      ULTRALYTICS_AUTOINSTALL: "false"
      YOLO_VERBOSE: "false"
    volumes:
      - ./storage:/storage
      - ./models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alpr-network
    restart: unless-stopped

  # ==================== Monitoring ====================
  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    environment:
      TZ: Asia/Bangkok
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - alpr-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      TZ: Asia/Bangkok
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - alpr-network

  # ==================== Reverse Proxy ====================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # เพิ่มบรรทัดนี้: เพื่อปิดไฟล์ default ที่มักจะมีปัญหา (ส่งไฟล์เปล่าไปทับ)
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - alpr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==================== Frontend ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    environment:
      TZ: Asia/Bangkok
    ports:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alpr-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # MLOps: Trainer Worker (queue: training)
  # รัน YOLO training + EasyOCR fine-tuning
  # ⚠️  แยก GPU resource จาก worker-gpu-1 โดย CUDA_VISIBLE_DEVICES
  # ─────────────────────────────────────────────────────────────────
  trainer-worker:
    build:
      context: ./mlops
      dockerfile: Dockerfile
    container_name: trainer-worker
    restart: unless-stopped
    command: >
      celery -A mlops.celery_app:celery_app worker
      -Q training --concurrency=1 -l info
      --pidfile=/tmp/celery_trainer.pid
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://alpr:alpr@postgres:5432/alpr
      - STORAGE_DIR=/storage
      - MODELS_DIR=/models
      - TRAINING_DIR=/storage/training
      - YOLO_TRAIN_DEVICE=0
      - YOLO_TRAIN_EPOCHS=50
      - YOLO_TRAIN_BATCH=8          # batch เล็กลง — trainer ใช้ VRAM ร่วมกับ production
      - RETRAIN_THRESHOLD=1000
      - MIN_MAP_IMPROVEMENT=0.001
      - OCR_TRAIN_BATCH=32
      # CUDA_VISIBLE_DEVICES: ถ้ามี 2 GPU → ใช้ GPU 1, production ใช้ GPU 0
      # ถ้ามี 1 GPU → ใช้ร่วมกัน (batch เล็กป้องกัน OOM)
      - CUDA_VISIBLE_DEVICES=${TRAINER_GPU:-0}
    volumes:
      - ./mlops:/app/mlops:ro        # source code (read-only)
      - model_data:/models           # shared models dir กับ production worker
      - storage_data:/storage        # training data
      - trainer_data:/data           # celerybeat schedule
    depends_on:
      - redis
      - postgres
    networks:
      - alpr-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ─────────────────────────────────────────────────────────────────
  # MLOps: Celery Beat Scheduler
  # ส่ง check_retrain_trigger task ทุก 1 ชั่วโมง
  # ─────────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: ./mlops
      dockerfile: Dockerfile
    container_name: celery-beat
    restart: unless-stopped
    command: >
      celery -A mlops.celery_app:celery_app beat
      -l info
      --schedule=/data/celerybeat-schedule
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://alpr:alpr@postgres:5432/alpr
      - RETRAIN_THRESHOLD=1000
    volumes:
      - ./mlops:/app/mlops:ro
      - trainer_data:/data
    depends_on:
      - redis
      - postgres
    networks:
      - alpr-network

volumes:
  pgdata:
  redisdata:
  trainer_data:
  model_data:
  storage_data:

networks:
  alpr-network:
    driver: bridge
